app = "ecosystem-cms"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  CMS_ENV = "production"
  CMS_DB = "/data/cms.sqlite3"
  CMS_HOST = "0.0.0.0"
  CMS_PORT = "8765"

[[mounts]]
  source = "ecosystem_cms_data"
  destination = "/data"
  initial_size = "1gb"

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

