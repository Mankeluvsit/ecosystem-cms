<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecosystem CMS — Control Lab</title><style>body{font:16px system-ui;background:#101827;color:#eaf1ff;margin:0}header{padding:24px;background:#1a2940}main{max-width:960px;margin:28px auto;padding:20px}section{background:#1a2940;border:1px solid #34475e;border-radius:12px;padding:18px;margin:16px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px;border-bottom:1px solid #34475e}label{min-width:240px}input{padding:9px;background:#0f1826;color:white;border:1px solid #60728b;border-radius:5px}button{padding:9px 15px;border:0;border-radius:5px;background:#78c7f5;color:#091b2c;cursor:pointer}small{color:#aabbd0}pre{white-space:pre-wrap}</style><header><h1>Ecosystem CMS</h1><small>Local Control Lab · Prototype, not production-ready</small></header><main><p>⚠ Demo uses spoofable identity headers. Run only on localhost.</p><div id="controls"></div><section><h2>Audit history</h2><button onclick="load()">Refresh</button><pre id="audit"></pre></section><section><h2>Other modules</h2><p>Auth, content, media, forum, chat, public site, and scoped API keys are not implemented.</p></section></main><script>const headers={'X-Actor':'local-demo','X-Role':'admin','Content-Type':'application/json'};async function req(path,options={}){const r=await fetch(path,{headers,...options});const j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));return j}async function load(){try{const s=await req('/api/state');let html='';for(const [category,items] of Object.entries(s)){html+='<section><h2>'+category+'</h2>';for(const [key,item] of Object.entries(items)){const id=category+'-'+key;html+='<div class="row"><label>'+key+'</label><input id="'+id+'" value="'+String(item.value).replaceAll('&','&amp;').replaceAll('"','&quot;')+'"><small>v'+item.version+'</small><button onclick="save('+JSON.stringify(category)+','+JSON.stringify(key)+','+item.version+')">Save</button></div>'}html+='</section>'}document.getElementById('controls').innerHTML=html;document.getElementById('audit').textContent=JSON.stringify(await req('/api/audit'),null,2)}catch(e){alert(e.message)}}async function save(category,key,version){const raw=document.getElementById(category+'-'+key).value;let value=raw;if(category==='flags'){if(raw!=='true'&&raw!=='false')return alert('Use true or false');value=raw==='true'}if(category==='settings'&&key==='chat.retention_days'){value=Number(raw)}try{await req('/api/change',{method:'POST',body:JSON.stringify({category,key,value,expected_version:version,reason:'admin control lab'})});await load()}catch(e){alert(e.message)}}load()</script></html>
